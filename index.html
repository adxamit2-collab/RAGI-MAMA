<html lang="bn"><head><meta charset="utf-8"><title>রাগী মামা – Troll Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#222;--btn:#a8501a;--btn2:#7a3a10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-touch-callout:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Hind Siliguri','Noto Sans Bengali','Vrinda',sans-serif}
#wrap{position:relative;width:100%;max-width:720px;border:4px solid #000;overflow:hidden}
#wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
canvas#c{width:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;top:1.5%;left:2%;font:clamp(7px,1.9vw,11px) 'Press Start 2P',monospace;color:#5a2a08}
#say{position:absolute;top:9%;width:100%;text-align:center;font-weight:700;font-size:clamp(12px,3.8vw,21px);color:#4a2006}
#ov{display:none;position:absolute;inset:0;background:#222;color:#f9c560;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px;z-index:2}
#dc{max-width:70%;image-rendering:pixelated}
#ox{font:clamp(14px,4.5vw,24px) 'Press Start 2P',monospace}
#om{font-weight:700;font-size:clamp(14px,4.2vw,22px);color:#fff}
#ot{font-size:clamp(12px,3.2vw,16px);opacity:.8}
#util{display:flex;gap:10px;justify-content:center;padding:10px 14px 0}#util button{width:60px;height:40px;font-size:18px}
#pad{width:100%;max-width:640px;display:flex;justify-content:space-between;padding:14px}
#pad div{display:flex;gap:10px}
button{width:72px;height:60px;font-size:26px;border:4px solid #3b1a05;background:var(--btn);color:#3b1a05;border-radius:0;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.2)}
button.on{background:var(--btn2)}
</style></head><body>

function gen(n){

 if(ft=='pit'){const a=6+Math.floor(r()*5);L.mods.push(m=>{for(let x=a;x<a+3;x++){m[9][x]='c';m[10][x]='.'}});L.sp.push({x:a,y:10,w:3});zone=[a-2,a+4]}
 if(ft=='stones'){const o=pick([4,7,10,13]);L.mods.push(m=>{for(let x=3;x<=16;x++)m[9][x]='.';[4,7,10,13].forEach(x=>m[7][x]=x==o?'c':'#')});L.sp.push({x:3,y:9,w:14});nopop=1}

 const cnt=boss?4:2+(n>=30)+(n>=60);

 if(dt=='key'){L.s=[7,8];L.key=[2,8];busy=[2,7,17]}
